[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # Override NEXT_PUBLIC_MERM8_API_URL in Netlify's dashboard for staging/preview environments
  NEXT_PUBLIC_MERM8_API_URL = "https://merm8.scheimann.workers.dev"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:"
