map $uri $cache_control {
    default                   "public, max-age=300, must-revalidate";
    ~^/_next/static/         "public, max-age=31536000, immutable";
    ~*\.html$                 "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self';" always;
    # Deliberately omit `always` so error responses do not receive immutable caching.
    add_header Cache-Control $cache_control;

    location ^~ /_next/static/ {
        # Build-generated filenames are fingerprinted and safe to cache permanently.
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
