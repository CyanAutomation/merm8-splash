name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to immutable action revisions; Dependabot keeps these current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check for peer dependency conflicts
        run: |
          if npm ls 2>&1 | grep -E "WARN|invalid|unmet"; then
            echo "⚠️ Peer dependency conflicts detected!"
            npm ls 2>&1 | grep -E "WARN|invalid|unmet" || true
            exit 1
          fi
      - run: npm test
      - run: npm run lint
      - run: npm run build
