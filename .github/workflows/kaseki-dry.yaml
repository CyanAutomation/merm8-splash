name: Kaseki DRY Sweep

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

run-name: >-
  DRY sweep · ${{ github.repository }}@${{ github.sha }}

permissions: {}

# Keep runs of this workflow serialized.
# GitHub retains one pending run per group; a newer run replaces it.
concurrency:
  group: kaseki-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare DRY sweep request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      payload: ${{ steps.build.outputs.payload }}
    steps:
      - name: Build DRY sweep payload
        id: build
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: main
          TASK_DESCRIPTION: Perform a conservative DRY-principle review of this repository.
          ALLOWLIST: app/**/*,lib/**/*,tests/**/*,types/**/*
          VALIDATION_COMMAND: npm run lint && npm test && npm run build
        run: |
          set -euo pipefail

          payload="$(
            node <<'NODE'
            const allowlist = process.env.ALLOWLIST.split(',')
              .map((path) => path.trim())
              .filter(Boolean);

            const payload = {
              repoUrl: process.env.REPO_URL,
              ref: process.env.REF,
              taskMode: 'patch',
              publishMode: 'pr',
              timeoutSeconds: 10800,
              maxDiffBytes: 102400,
              changedFilesAllowlist: allowlist,
              validationCommands: [process.env.VALIDATION_COMMAND],
              goalCheck: {
                enabled: true,
                maxRetries: 1,
              },
              taskPrompt: `${process.env.TASK_DESCRIPTION}

          Look for duplicated knowledge rather than merely duplicated text. Strong candidates include repeated business rules, validation rules, constants, configuration knowledge, parsing or normalisation logic, transformations, and substantially identical implementations that must remain synchronised.

          Do not assume that all repetition violates DRY. Similar-looking code may represent separate concepts or may need to evolve independently. Prefer clear duplication over an abstraction that increases coupling, indirection, or cognitive load.

          Identify the single strongest DRY improvement available. Only act when the duplication represents the same underlying knowledge and consolidation has a clear maintenance benefit.

          Prefer reusing an existing abstraction. If a new abstraction is justified, keep it at the narrowest sensible scope.

          Make at most one focused refactoring.

          A no-change result is successful. If there is no sufficiently valuable, high-confidence DRY improvement, make no changes.`,
            };

            process.stdout.write(JSON.stringify(payload));
          NODE
          )"

          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"

  dry_sweep:
    name: Run Kaseki DRY sweep
    needs: prepare
    uses: ./.github/workflows/kaseki-run.yml # zizmor: ignore[self-repository] Preserve caller-revision semantics.
    with:
      payload: ${{ needs.prepare.outputs.payload }}
      task_description: Perform a conservative DRY-principle review of this repository.
      allowlist: app/**/*,lib/**/*,tests/**/*,types/**/*
      validation_command: npm run lint && npm test && npm run build
