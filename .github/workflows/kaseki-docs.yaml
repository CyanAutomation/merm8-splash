name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ github.sha }}

permissions: {}

concurrency:
  # Workflow-specific groups keep one sweep from replacing the other's pending run.
  # GitHub keeps one running and one pending run per group; newer pending runs replace older ones.
  group: kaseki-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare documentation sweep request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      payload: ${{ steps.build.outputs.payload }}
    steps:
      - name: Build documentation sweep payload
        id: build
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: main
          TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
          ALLOWLIST: README.md,docs/**/*.md
          VALIDATION_COMMAND: npm run check:readme && npm run lint && npm test && npm run build
        run: |
          set -euo pipefail

          payload="$(
            node <<'NODE'
            const allowlist = process.env.ALLOWLIST.split(',')
              .map((path) => path.trim())
              .filter(Boolean);
            const validationCommand = process.env.VALIDATION_COMMAND;

            const payload = {
              repoUrl: process.env.REPO_URL,
              ref: process.env.REF,
              taskMode: 'patch',
              publishMode: 'pr',
              timeoutSeconds: 10800,
              maxDiffBytes: 102400,
              scouting: { enabled: false },
              goalSetting: { enabled: false },
              goalCheck: { enabled: false },
              changedFilesAllowlist: allowlist,
              validationCommands: validationCommand ? [validationCommand] : [],
              taskPrompt: `${process.env.TASK_DESCRIPTION}

          Perform the documentation sweep for this repository. First read repository instructions, then inspect the current implementation and compare it against README.md and documentation under docs/. Update documentation only where inaccurate, incomplete, or stale. Do not modify application code, tests, configuration, dependencies, lockfiles, CI workflows, or generated files. Do not invent behavior. Avoid cosmetic rewrites. Before finishing, review the diff to confirm it contains documentation-only changes. If documentation is already accurate, make no changes and do not open a pull request.`,
            };

            process.stdout.write(JSON.stringify(payload));
          NODE
          )"

          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"

  docs_sweep:
    name: Run Kaseki documentation sweep
    needs: prepare
    uses: ./.github/workflows/kaseki-run.yml # zizmor: ignore[self-repository] Preserve caller-revision semantics.
    with:
      payload: ${{ needs.prepare.outputs.payload }}
      task_description: Keep README.md and docs/ accurate against the current implementation.
      allowlist: README.md,docs/**/*.md
      validation_command: npm run check:readme && npm run lint && npm test && npm run build
