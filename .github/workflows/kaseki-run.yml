name: Kaseki Soyuz Submission

on:
  workflow_call:
    inputs:
      payload:
        description: JSON payload for the Kaseki run, without an idempotency key.
        required: true
        type: string
      task_description:
        description: Short description included in the submission summary.
        required: true
        type: string
      allowlist:
        description: Comma-separated files the Kaseki task may change.
        required: true
        type: string
      validation_command:
        description: Validation command sent to Soyuz and shown in the summary.
        required: true
        type: string

permissions: {}

jobs:
  run:
    name: Submit Kaseki task to Soyuz
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    environment: soyuz
    env:
      SOYUZ_BASE_URL: ${{ vars.SOYUZ_BASE_URL }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main
      TASK_DESCRIPTION: ${{ inputs.task_description }}
      ALLOWLIST: ${{ inputs.allowlist }}
      VALIDATION_COMMAND: ${{ inputs.validation_command }}

    steps:
      - name: Check out caller revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate Soyuz configuration and required tools
        shell: bash
        run: |
          set -euo pipefail

          : "${SOYUZ_BASE_URL:?Configure SOYUZ_BASE_URL as an environment variable}"
          command -v jq >/dev/null
          command -v node >/dev/null
          command -v curl >/dev/null

      - name: Validate Soyuz URL
        run: node --experimental-strip-types scripts/validate-soyuz-url.ts

      - name: Submit run to Soyuz
        id: submit
        shell: bash
        env:
          SOYUZ_SUBMISSION_API_TOKEN: ${{ secrets.SOYUZ_SUBMISSION_API_TOKEN }}
          PAYLOAD_JSON: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          : "${SOYUZ_BASE_URL:?SOYUZ_BASE_URL is not configured}"
          : "${SOYUZ_SUBMISSION_API_TOKEN:?Configure SOYUZ_SUBMISSION_API_TOKEN as an environment secret}"
          : "${PAYLOAD_JSON:?Kaseki request payload is missing}"

          idempotency_key="$(
            node <<'NODE'
            const { createHash } = require('node:crypto');
            const namespace = Buffer.from('6ba7b8119dad11d180b400c04fd430c8', 'hex');
            const identity = [
              process.env.GITHUB_REPOSITORY,
              process.env.GITHUB_WORKFLOW,
              process.env.GITHUB_RUN_ID,
            ];

            if (identity.some((value) => !value)) {
              throw new Error('GitHub run identity is incomplete');
            }

            const digest = createHash('sha1')
              .update(namespace)
              .update(JSON.stringify(identity), 'utf8')
              .digest()
              .subarray(0, 16);
            digest[6] = (digest[6] & 0x0f) | 0x50;
            digest[8] = (digest[8] & 0x3f) | 0x80;

            const hex = digest.toString('hex');
            process.stdout.write(
              `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}\n`,
            );
          NODE
          )"

          payload="$(jq -ce --arg idempotencyKey "$idempotency_key" \
            'if type == "object" then . + {idempotencyKey: $idempotencyKey} else error("payload must be a JSON object") end' \
            <<< "$PAYLOAD_JSON")"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$SOYUZ_BASE_URL/v1/runs" \
              --header "Authorization: Bearer $SOYUZ_SUBMISSION_API_TOKEN" \
              --header "Idempotency-Key: $idempotency_key" \
              --header 'Content-Type: application/json' \
              --data "$payload" || true
          )"

          if [[ ! "$http_status" =~ ^(200|202)$ ]]; then
            echo "::error title=Soyuz submission failed::Soyuz returned HTTP $http_status"
            {
              echo "Soyuz returned HTTP \`$http_status\`. Response body omitted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          run_id="$(jq -er '.data.id | strings' "$response_file")"
          run_id="$(SOYUZ_RUN_ID="$run_id" node --experimental-strip-types scripts/validate-soyuz-run-id.ts)"
          display_id="$(jq -er '.data.displayId | strings | select(test("^soyuz-[0-9]+$"))' "$response_file")"
          run_status="$(jq -er '.data.status | strings | select(test("^(admitting|queued|claimed|running|cancel_requested|cancelled|completed|failed|admission_failed)$"))' "$response_file")"
          {
            printf 'run_id=%s\n' "$run_id"
            printf 'display_id=%s\n' "$display_id"
            printf 'run_status=%s\n' "$run_status"
            printf 'submission_status=accepted\n'
          } >> "$GITHUB_OUTPUT"

          echo "Soyuz accepted the Kaseki task as $display_id."

      - name: Publish Soyuz submission details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          DISPLAY_ID: ${{ steps.submit.outputs.display_id || 'not assigned' }}
          RUN_STATUS: ${{ steps.submit.outputs.run_status || 'not received' }}
          SUBMISSION_STATUS: ${{ steps.submit.outputs.submission_status || 'not accepted' }}
        run: |
          # Escape Markdown table delimiters in task descriptions before writing the summary.
          task_description_for_summary="${TASK_DESCRIPTION//|/\\|}"
          {
            echo "## Soyuz Kaseki submission"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Task | $task_description_for_summary |"
            echo "| Allowed paths | \`$ALLOWLIST\` |"
            echo "| Validation | \`$VALIDATION_COMMAND\` |"
            echo "| Mode | \`patch\` → full PR (not draft) |"
            echo "| Timeout | 3 hours |"
            echo "| Maximum diff | 100 KiB |"
            echo "| Submission | \`$SUBMISSION_STATUS\` |"
            echo "| Soyuz run | \`$DISPLAY_ID\` (\`$RUN_ID\`) |"
            echo "| Run status at submission | \`$RUN_STATUS\` |"
            echo
            echo "Accepted means Soyuz admitted the task; it does not confirm execution completion. Monitor the run in the Soyuz dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
